# Standalone tracker retired. Human access belongs to the ZITADEL-gated Backoffice.
# Keep an explicit tombstone so this hostname cannot fall through to another site.
server {
    listen 80;
    listen [::]:80;
    server_name tracker.vulpine.llc;
    return 410;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tracker.vulpine.llc;
    ssl_certificate /etc/letsencrypt/live/tracker.vulpine.llc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker.vulpine.llc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/vulpine-security-headers.conf;
    return 410;
}
