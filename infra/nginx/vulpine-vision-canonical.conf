# Canonical Cabinet Brain API surface for api.vulpinehomes.com.
#
# Include this location inside the existing TLS server block. Existing exact
# Bids Tracker and Documents locations continue to win. The Vision application
# performs Bearer-token and signed-principal authorization on every route
# reachable through this boundary.
location ~ ^/api/(assistant|backoffice|chat|exports|jobs|measurements|notifications|plan-sheets|processing-settings|projects|runs|uploads)(?:/|$) {
    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
