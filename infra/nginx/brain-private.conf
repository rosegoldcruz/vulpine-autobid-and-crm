server {
    server_name brain.vulpine.llc;

    # Password protect
    auth_basic "AEON Vault";
    auth_basic_user_file /etc/nginx/.htpasswd.brain;

    root /var/lib/aeon-quartz-private/current;
    index index.html;

    location / {
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires off;
        include /etc/nginx/snippets/vulpine-security-headers.conf;
        add_header Cache-Control "private, no-store";
    }

    location ~* \.html$ {
        include /etc/nginx/snippets/vulpine-security-headers.conf;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/brain.vulpine.llc/fullchain.pem; # managed by Certbot
    include /etc/nginx/snippets/vulpine-security-headers.conf;
    ssl_certificate_key /etc/letsencrypt/live/brain.vulpine.llc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = brain.vulpine.llc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name brain.vulpine.llc;
    return 404; # managed by Certbot


}