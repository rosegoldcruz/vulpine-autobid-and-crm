name: vulpine-erpnext

x-app: &app
  image: vulpine-erpnext:15.122.0-hrms15.64.3
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 1g
  cpus: 2
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  db:
    image: mariadb:10.11
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    restart: unless-stopped
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --skip-character-set-client-handshake]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  redis-cache:
    image: redis:7-alpine
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    restart: unless-stopped
  redis-queue:
    image: redis:7-alpine
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - queue:/data
  configurator:
    <<: *app
    restart: on-failure
    entrypoint: [bash, -ec]
    command:
      - |
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host db
        bench set-config -gp db_port 3306
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379
        bench set-config -gp socketio_port 9000
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
  backend:
    <<: *app
    # Only the isolated Docker network can reach Gunicorn; trust its nginx proxy.
    environment:
      FORWARDED_ALLOW_IPS: '*'
  frontend:
    <<: *app
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: ${ERP_PROXY_TRUSTED_IP:-127.0.0.1}
      FRAPPE_SITE_NAME_HEADER: ${ERP_SITE_NAME:?Missing required env var ERP_SITE_NAME}
      PROXY_READ_TIMEOUT: '120'
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - '127.0.0.1:8090:8080'
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started
  websocket:
    <<: *app
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
  queue-short:
    <<: *app
    command: [bench, worker, --queue, 'short,default']
  queue-long:
    <<: *app
    command: [bench, worker, --queue, 'long,default,short']
  scheduler:
    <<: *app
    command: [bench, schedule]
  create-site:
    <<: *app
    profiles: [setup]
    restart: 'no'
    entrypoint: [bash, -ec]
    environment:
      ERP_SITE_NAME: ${ERP_SITE_NAME:?Missing required env var ERP_SITE_NAME}
    secrets: [db_password, admin_password]
    command:
      - |
        if [ -f "sites/$$ERP_SITE_NAME/site_config.json" ]; then
          echo 'Site already exists; refusing to overwrite it.' >&2
          exit 1
        fi
        bench new-site "$$ERP_SITE_NAME" --db-root-username root --db-root-password "$$(cat /run/secrets/db_password)" --admin-password "$$(cat /run/secrets/admin_password)" --mariadb-user-host-login-scope '%' --install-app erpnext
        bench --site "$$ERP_SITE_NAME" install-app hrms
        bench --site "$$ERP_SITE_NAME" set-config host_name "https://$$ERP_SITE_NAME"
        bench --site "$$ERP_SITE_NAME" execute frappe.db.set_single_value --args '["Website Settings","disable_signup",1]'
        bench --site "$$ERP_SITE_NAME" execute frappe.db.set_single_value --args '["System Settings","allow_consecutive_login_attempts",5]'
        bench --site "$$ERP_SITE_NAME" execute frappe.db.set_single_value --args '["System Settings","allow_login_after_fail",300]'
        bench --site "$$ERP_SITE_NAME" execute frappe.db.set_value --args '["Workspace","Stock","is_hidden",1]'
        bench --site "$$ERP_SITE_NAME" enable-scheduler

secrets:
  db_password:
    file: ${ERP_SECRETS_DIR:?Missing required env var ERP_SECRETS_DIR}/db_password
  admin_password:
    file: ${ERP_SECRETS_DIR:?Missing required env var ERP_SECRETS_DIR}/admin_password
volumes:
  database:
  sites:
  logs:
  queue:
