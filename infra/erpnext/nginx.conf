# Enable this HTTP bootstrap only after erp.vulpine.llc points to the VPS.
# Obtain TLS with certbot --nginx -d erp.vulpine.llc before exposing ERPNext.
server {
    listen 80;
    listen [::]:80;
    server_name erp.vulpine.llc;
    client_max_body_size 50m;

    location / {
        # Keep application private until TLS is installed; replace with the
        # proxy directives below inside the HTTPS server after certificate issue.
        return 503;
    }
}

