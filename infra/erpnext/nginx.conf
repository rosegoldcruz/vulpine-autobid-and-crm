# Install after obtaining the pay.vulpine.llc certificate with certbot.
server {
    listen 80;
    listen [::]:80;
    server_name pay.vulpine.llc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pay.vulpine.llc;
    ssl_certificate /etc/letsencrypt/live/pay.vulpine.llc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.vulpine.llc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/vulpine-security-headers.conf;
    client_max_body_size 50m;

    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_redirect off;
        proxy_cookie_flags ~ secure;
    }
}
