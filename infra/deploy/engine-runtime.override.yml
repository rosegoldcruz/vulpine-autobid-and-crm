# Use with services/engine/docker-compose.yml and the existing Compose project.
# Runtime credentials and persistent uploads stay outside canonical source.
services:
  api:
    env_file: !override
      - ${ENGINE_API_ENV_FILE:?ENGINE_API_ENV_FILE is required}
    volumes: !override
      - ./services:/app/services:ro
      - ./shared:/app/shared:ro
      - ${ENGINE_UPLOAD_ROOT:?ENGINE_UPLOAD_ROOT is required}:/app/uploads

  n8n:
    volumes: !override
      - n8ndata:/home/node/.n8n
      - ${ENGINE_N8N_WORKFLOWS:?ENGINE_N8N_WORKFLOWS is required}:/home/node/.n8n/workflows
