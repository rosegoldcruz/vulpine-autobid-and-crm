# Include inside the existing API HTTPS server. The upstream verifies signed
# organization/user claims on every asset, draft and export request.
location ^~ /cabinet-pricing/ {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:3021/;
    proxy_set_header Host 127.0.0.1:3021;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
