# Insert within the existing api.vulpinehomes.com HTTPS server.
location ^~ /bidding/downloads/ {
    access_log off;
    proxy_pass http://127.0.0.1:3022/downloads/;
    proxy_set_header Host 127.0.0.1:3022;
}
location ^~ /bidding/ {
    client_max_body_size 3m;
    proxy_pass http://127.0.0.1:3022/;
    proxy_set_header Host 127.0.0.1:3022;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
}
location = /.well-known/oauth-protected-resource/bidding/mcp {
    proxy_pass http://127.0.0.1:3022/.well-known/oauth-protected-resource;
}
