packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# Typed UI packages must resolve their host application's React types rather
# than inheriting the React 18 types used by other workspace applications.
packageExtensions:
  "next@16.3.8":
    peerDependencies:
      "@types/react": "^19.0.0"
      "@types/react-dom": "^19.0.0"
  "cmdk@1.1.1":
    peerDependencies:
      "@types/react": "^18.0.0 || ^19.0.0"
  "vaul@1.1.2":
    peerDependencies:
      "@types/react": "^18.0.0 || ^19.0.0"
  "input-otp@1.4.2":
    peerDependencies:
      "@types/react": "^18.0.0 || ^19.0.0"
  "react-day-picker@9.13.2":
    peerDependencies:
      "@types/react": "^18.0.0 || ^19.0.0"
  "lucide-react@0.564.0":
    peerDependencies:
      "@types/react": "^18.0.0 || ^19.0.0"

  "recharts@2.15.0":
    peerDependencies:
      "@types/react": "^18.0.0 || ^19.0.0"
  "motion@12.34.3":
    peerDependencies:
      "@types/react": "^18.0.0 || ^19.0.0"
  "framer-motion@12.34.3":
    peerDependencies:
      "@types/react": "^18.0.0 || ^19.0.0"
  "next-themes@0.4.6":
    peerDependencies:
      "@types/react": "^18.0.0 || ^19.0.0"
  "sonner@1.7.4":
    peerDependencies:
      "@types/react": "^18.0.0 || ^19.0.0"
  "react-resizable-panels@2.1.9":
    peerDependencies:
      "@types/react": "^18.0.0 || ^19.0.0"
  "embla-carousel-react@8.6.0":
    peerDependencies:
      "@types/react": "^18.0.0 || ^19.0.0"
  "react-hook-form@7.71.1":
    peerDependencies:
      "@types/react": "^18.0.0 || ^19.0.0"

allowBuilds:
  sharp: true
  canvas: true
  better-sqlite3: true
  protobufjs: true
  esbuild: true
